services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emailo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emailo}
      POSTGRES_DB: emailo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://emailo:${POSTGRES_PASSWORD:-emailo}@postgres:5432/emailo?schema=public
      DIRECT_URL: postgresql://emailo:${POSTGRES_PASSWORD:-emailo}@postgres:5432/emailo?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_MICROSOFT_ID: ${AUTH_MICROSOFT_ID:-}
      AUTH_MICROSOFT_SECRET: ${AUTH_MICROSOFT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://emailo:${POSTGRES_PASSWORD:-emailo}@postgres:5432/emailo?schema=public
      DIRECT_URL: postgresql://emailo:${POSTGRES_PASSWORD:-emailo}@postgres:5432/emailo?schema=public
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

volumes:
  pgdata:
  redisdata: